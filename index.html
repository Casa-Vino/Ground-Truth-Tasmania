  const rock=refs.length===c.bhs.length?refs.reduce((a,b)=>a+b,0)/refs.length:null;
  const data=ls.map((l,i)=>{const lg=c.logs.layers[i],lb=c.lab.layers[i]||{};const np=!!lb.np;
    const top=l.top,bot=i===ls.length-1?3:Math.min(l.bot,3);
    return{top,bot:bot,shownBot:Math.min(l.bot,maxD),tex:lg.tex,mun:lg.mun,ll:np?null:lb.ll,lm:lb.method,pl:np?null:lb.pl,pi:np?null:r1(lb.ll-lb.pl),LS:lb.ls??0,np,sandy:SANDY.includes(lg.tex)||np,fill:l.fill,org:l.organic,desc:l.desc}});
  const calc=ysCalc(data,rock);
  showModal(`<div class="sub">#${c.id} · ${esc(c.town)} · for ${esc(c.client)}</div><h2>Site classification report</h2>
   <div class="eyebrow">Fieldwork</div>
   <div class="scroll"><table class="tbl"><thead><tr><th>BH</th><th>Tube depth</th><th>DCP</th><th>Min blows/100 mm (top 0.8 m)</th></tr></thead><tbody>
    ${c.bhs.map((b,i)=>`<tr><td>BH${i+1}</td><td class="num">${b.depth.toFixed(2)} m${b.ref!=null?' (refusal)':''}</td><td class="num">${b.dcpRef!=null?'Refusal '+b.dcpRef.toFixed(2)+' m':'2.0 m, no refusal'}</td><td class="num">${b.dcp.length?Math.min(...b.dcp.slice(0,8)):'—'}</td></tr>`).join('')}</tbody></table></div>
   ${c.penalties.length?`<p class="c-bad mono" style="font-size:12px">${c.penalties.map(esc).join('<br>')}</p>`:''}
   <div class="eyebrow">Soil profile & lab results</div>
   <div class="scroll"><table class="tbl"><thead><tr><th>Depth (m)</th><th>Field description</th><th>LL</th><th>PL</th><th>PI</th><th>LS %</th><th>USCS</th></tr></thead><tbody>
    ${data.map((d,i)=>`<tr><td class="num">${d.top.toFixed(2)}–${d.shownBot.toFixed(2)}</td><td>${TEX[texIdx(d.tex)].n.toUpperCase()}${d.fill?' (FILL)':''}, ${munsellName(d.mun.h,d.mun.v,d.mun.c)} (${munStr(d.mun)})<br><span class="dim" style="font-size:12px">${esc(d.desc.split(':')[0])}</span></td>
     <td class="num">${d.np?'NP':d.ll}${d.np||!d.lm?'':`<br><span class="dim" style="font-size:11px">${d.lm==='casa'?'cup':'cone'}</span>`}</td><td class="num">${d.np?'NP':d.pl}</td><td class="num">${d.np?'NP':d.pi}</td><td class="num">${d.LS}</td>
     <td><select id="us${i}" aria-label="USCS group for layer ${i+1}"><option value="">—</option>${USCS.map(u=>`<option>${u}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
    <div><div class="eyebrow">Casagrande plasticity chart</div><canvas id="pchart"></canvas></div>
    <div><div class="eyebrow">Characteristic surface movement, y<sub>s</sub></div>
     <p class="dim" style="font-size:12.5px;margin:4px 0">y<sub>s</sub> = Σ I<sub>ss</sub> · Δu · h / 100. Game simplifications: H<sub>s</sub> = ${HS} m, Δu = 1.2 pF at the surface falling to 0 at H<sub>s</sub>, I<sub>ss</sub> ≈ 0.3 × LS (in practice, run shrink-swell tests). Calculation stops at refusal: ${rock!=null?rock.toFixed(2)+' m (average DCP refusal)':'no refusal recorded'}.</p>
     <div class="scroll"><table class="tbl"><thead><tr><th>z (m)</th><th>I<sub>ss</sub></th><th>Δu</th><th>h (mm)</th><th>y (mm)</th></tr></thead><tbody>
      ${calc.rows.map(r=>`<tr><td class="num">${r.top.toFixed(2)}–${r.bot.toFixed(2)}</td><td class="num">${r.iss.toFixed(1)}</td><td class="num">${r.du.toFixed(2)}</td><td class="num">${Math.round(r.h)}</td><td class="num">${r.y.toFixed(1)}</td></tr>`).join('')}
      <tr><td colspan="4"><b>y<sub>s</sub> (from your data)</b></td><td class="num"><b>${calc.ys.toFixed(0)} mm</b></td></tr></tbody></table></div></div>
   </div>
   <div class="tip">AS 2870 classes: <b>A</b> sand/rock, little movement · <b>S</b> y<sub>s</sub> 0–20 mm · <b>M</b> 20–40 · <b>H1</b> 40–60 · <b>H2</b> 60–75 · <b>E</b> &gt; 75 · <b>P</b> problem site (uncontrolled fill, soft soils, landslip, collapsing soils, mine subsidence…), regardless of y<sub>s</sub>.</div>
   <div class="row"><label>Site class <select id="rcls"><option value="">—</option>${CLASSES.map(k=>`<option>${k}</option>`).join('')}</select></label>
    <label>Footing recommendation <select id="rft"><option value="">—</option>${FOOTINGS.map(f=>`<option value="${f.k}">${f.n}</option>`).join('')}</select></label></div>
   <div class="row"><button class="btn go" id="rSub">Sign & submit (1 h 30)</button><button class="btn" data-act="closeModal">Not yet</button></div>`);
  // plasticity chart
  const cv=$('#pchart'),x=setupCanvas(cv,300,220),X=v=>30+v/110*260,Y=v=>200-v/70*185;
  x.fillStyle='#0b1211';x.fillRect(0,0,300,220);x.strokeStyle='#2d3d39';x.strokeRect(30,15,260,185);
  x.strokeStyle='#efdb72';x.beginPath();x.moveTo(X(20),Y(0));x.lineTo(X(110),Y(.73*90));x.stroke();
  x.strokeStyle='#93a69e';x.setLineDash([3,3]);x.beginPath();x.moveTo(X(50),Y(0));x.lineTo(X(50),Y(70));x.stroke();x.setLineDash([]);
  x.fillStyle='#93a69e';x.font='10px IBM Plex Mono';x.fillText('A-line',X(88),Y(.73*68)-6);x.fillText('LL →',258,214);x.fillText('PI',4,20);
  [['CL',35,22],['CH',75,52],['ML',36,4],['MH',80,18]].forEach(([t,a,b])=>x.fillText(t,X(a),Y(b)));
  [0,20,40,60,80,100].forEach(v=>x.fillText(v,X(v)-6,212));[0,20,40,60].forEach(v=>x.fillText(v,8,Y(v)+3));
  data.forEach((d,i)=>{if(d.np)return;x.fillStyle='#ff9b30';x.beginPath();x.arc(X(d.ll),Y(Math.max(0,d.pi)),5,0,7);x.fill();x.fillStyle='#1b1205';x.font='bold 9px IBM Plex Mono';x.fillText(i+1,X(d.ll)-3,Y(Math.max(0,d.pi))+3)});
  $('#rSub').onclick=()=>{const cls=$('#rcls').value,ft=$('#rft').value;if(!cls||!ft){toast('Pick a site class and a footing recommendation.','bad');return}
    const us=data.map((d,i)=>$('#us'+i).value);submitReport(c,cls,ft,us,data,calc,rock)};
}
function submitReport(c,cls,ft,us,data,calc,rock){
  spend(90);
  const T=truthClass(c),ord=['A','S','M','H1','H2','E'];
  let pay=c.fee,rep=0;const notes=[];
  if(cls===T.cls){rep+=6;notes.push(`Site class ${cls} is correct. The engineer signs off without a single email.`)}
  else if(T.cls==='P'){pay*=.5;rep-=12;notes.push(`This was a <b>Class P</b> site (${T.why}). You called it ${cls}. A slab on that ground ends in a lawyer’s office.`)}
  else if(cls==='P'){pay*=.75;rep-=3;notes.push(`You called Class P, but it was ${T.cls}. The client paid for piers they didn’t need. Grumbling ensues.`)}
  else{const off=Math.abs(ord.indexOf(cls)-ord.indexOf(T.cls));
    if(off===1){pay*=.85;rep+=1;notes.push(`Close: actual class ${T.cls} (y<sub>s</sub> ≈ ${T.ys.toFixed(0)} mm), you said ${cls}. The engineer queried it.`)}
    else{pay*=.6;rep-=8;notes.push(`Way off: actual class ${T.cls} (y<sub>s</sub> ≈ ${T.ys.toFixed(0)} mm), you said ${cls}. ${ord.indexOf(cls)<ord.indexOf(T.cls)?'Three years later the slab cracks. The builder calls. Then their lawyer.':'The client’s footings are wildly over-designed and they know it.'}`)}}
  const F=FOOTINGS.find(f=>f.k===ft);
  if(F.for.includes(cls))notes.push('Footing recommendation matches your class.');else{rep-=2;notes.push(`Footing recommendation doesn’t suit Class ${cls}. Remember to match the footing to your class.`)}
  let uOK=0;data.forEach((d,i)=>{if(uscsFrom(d.ll,d.pi,d.np,d.tex,d.org).includes(us[i]))uOK++});
  rep+=uOK>=data.length?2:0;notes.push(`USCS groups: ${uOK}/${data.length} consistent with your own plasticity chart.`);
  if(rock!=null&&rock<c.prof.rock-.3)notes.push(`Your DCP refusal (${rock.toFixed(2)} m) was shallower than actual ${c.prof.rockName} at ${Math.min(c.prof.rock,9).toFixed(2)} m. ${c.bhs.some(b=>b.floater!=null&&b.dcpRef!=null&&Math.abs(b.dcpRef-b.floater)<.1)?'At least one hole stopped on a floater.':''}`);
  const labErr=c.lab.layers.map((lb,i)=>{const l=c.prof.layers[i];return lb.np||l.PL==null?0:Math.abs(lb.pl-l.PL)}).reduce((a,b)=>Math.max(a,b),0);
  notes.push(labErr<1.5?'Plastic limits within 1.5% of the reference. Lovely thread work.':`Your worst PL was ${labErr.toFixed(1)}% off the reference.`);
  pay=Math.round(pay);S.money+=pay;S.rep=clamp(S.rep+rep,0,100);S.stats.done++;S.stats.earned+=pay;
  c.status='done';c.result={cls,truth:T.cls,pay,rep};
  eva(`#${c.id} ${c.town}: report submitted. Paid ${money(pay)}. Reputation ${rep>=0?'+':''}${rep}.`);
  showModal(`<div class="sub">#${c.id} · ${esc(c.town)} · report card</div><h2>${cls===T.cls?'Mission accomplished':'Report submitted'}</h2>
   <div class="row" style="gap:28px"><div><div class="dim">Paid</div><div class="big">${money(pay)}</div></div><div><div class="dim">Reputation</div><div class="big" style="color:${rep>=0?'var(--radar)':'var(--bad)'}">${rep>=0?'+':''}${rep}</div></div><div><div class="dim">Your class / actual</div><div class="big" style="color:var(--book)">${cls} / ${T.cls}</div></div></div>
   <ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul>
   <div class="row"><button class="btn go" data-act="closeModal">Back to the map</button></div>`);
  S.tab='map';checkOver();
}

function start(data){
  const saved=data&&data.S?data.S:load();
  if(saved&&saved.v===1&&!saved.over){S=saved;if(!S.seen)S.seen=[{lon:HQ.lon,lat:HQ.lat,r:55}];render();toast('Welcome back. Game restored.')}
  else{newGame();render();intro()}
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
