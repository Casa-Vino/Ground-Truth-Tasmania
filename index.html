<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An edu-tainment game about residential foundation assessments across Tasmania.">
<title>Ground Truth Tasmania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: command console. HUD strip on top, tab rail, then a map "theatre" beside a briefing column.
   Minigames open in a field-sheet modal. Deliberately single dark look (night-shift site office). */
:root{
  --bg:#0f1514; --panel:#161f1d; --panel2:#1d2826; --line:#2d3d39; --fg:#e1e8e3; --dim:#93a69e;
  --radar:#8bd897; --hivis:#ff9b30; --book:#efdb72; --bad:#ff6455; --water:#4aa3ff;
  --f-display:'Saira Stencil One', Impact, 'Arial Black', sans-serif;
  --f-body:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(circle at 20% 0%,#1a2624 0,transparent 55%);}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--book);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.04em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.wrap{max-width:1280px;margin:0 auto}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{font-family:var(--f-display);font-size:22px;color:var(--hivis);letter-spacing:.06em;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.2em}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.stat b{font-family:var(--f-mono);font-size:16px;font-weight:600}
.bar{height:6px;width:120px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--book)}
.bar.rep i{background:var(--radar)}
.hud .spacer{flex:1}
.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:7px 12px;border-radius:2px;font-weight:600;letter-spacing:.02em}
.btn:hover:not(:disabled){border-color:var(--hivis)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--hivis);color:#1b1205;border-color:var(--hivis)}
.btn.go:hover:not(:disabled){filter:brightness(1.1)}
.btn.ok{background:var(--radar);color:#0b1a0e;border-color:var(--radar)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* tabs */
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{background:none;border:1px solid var(--line);border-bottom:none;color:var(--dim);padding:8px 14px;font-family:var(--f-display);font-size:15px;letter-spacing:.06em;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--bg);background:var(--book);border-color:var(--book)}
.tab .pip{display:inline-block;min-width:18px;padding:0 4px;margin-left:6px;border-radius:9px;background:var(--hivis);color:#1b1205;font-family:var(--f-mono);font-size:11px}
.view{border:1px solid var(--line);background:var(--panel);padding:16px;min-height:420px}

/* map */
.theatre{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.theatre{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;background:#0b1211;border:1px solid var(--line);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(139,216,151,.035) 0 1px,transparent 1px 3px)}
.fogbtn{position:absolute;top:8px;right:8px;z-index:2}
.fogbtn[aria-pressed="true"]{border-color:var(--book);color:var(--book)}
.maplegend{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.marker{cursor:pointer}
.marker:focus-visible{outline:none}
.marker:focus-visible circle,.marker:focus-visible rect{stroke:var(--book);stroke-width:3}
@keyframes pulse{0%{r:9;opacity:.9}100%{r:22;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.brief{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{border:1px solid var(--line);background:var(--panel2);padding:14px}
.card h3{font-size:19px;color:var(--book)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--hivis)}
.ops{display:flex;flex-direction:column;gap:6px}
.op{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 8px;cursor:pointer;color:var(--fg);text-align:left}
.op:hover{border-color:var(--hivis)}
.op .n{font-family:var(--f-display);font-size:18px;color:var(--radar);text-align:center}
.chip{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.c-hv{color:var(--hivis)}.c-ok{color:var(--radar)}.c-bad{color:var(--bad)}.c-bk{color:var(--book)}.c-dim{color:var(--dim)}
.feed{font-family:var(--f-mono);font-size:12px;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.feed div{color:var(--dim)}.feed div b{color:var(--radar);font-weight:600}

/* site */
.sitegrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.sitegrid{grid-template-columns:minmax(0,1fr)}}
canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
.planwrap{border:1px solid var(--line);background:#0b1211}
.bhlist{display:flex;flex-direction:column;gap:8px}
.bh{border:1px solid var(--line);background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.bh header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bh header b{font-family:var(--f-display);font-size:17px;letter-spacing:.05em}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim)}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle;background:var(--c)}

/* lab, crew, gear */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.person{display:flex;flex-direction:column;gap:8px}
.skills{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.pips{font-family:var(--f-mono);color:var(--book);letter-spacing:2px}
.quote{font-style:italic;color:var(--book);font-size:14px}
.labrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.timer{height:8px;background:var(--bg);border:1px solid var(--line);position:relative}
.timer i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c0512a,var(--hivis))}

/* manual */
.manual{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px}
@media (max-width:760px){.manual{grid-template-columns:minmax(0,1fr)}}
.manual nav{display:flex;flex-direction:column;gap:2px}
.manual nav button{background:none;border:none;border-left:2px solid var(--line);color:var(--dim);text-align:left;padding:5px 10px}
.manual nav button[aria-current="true"]{border-left-color:var(--hivis);color:var(--fg)}
.manual article{max-width:68ch}
.manual article h2{font-size:24px;color:var(--book);margin-bottom:8px}
.manual article p,.manual article li{color:#cdd7d1}
.tbl{border-collapse:collapse;font-size:13px;width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600}
.tbl td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;max-width:100%}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,8,7,.82);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modalx{position:absolute;top:10px;right:10px;padding:2px 9px;font-size:16px;line-height:1.4}
.sheet{position:relative;width:min(860px,100%);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--hivis);padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:24px;color:var(--book)}
.sheet .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--hivis)}
.tip{border-left:3px solid var(--book);background:var(--panel2);padding:8px 12px;font-size:14px;color:#d6dfd9}
.msg{font-family:var(--f-mono);font-size:13px;min-height:2.6em;color:var(--radar)}
.msg.bad{color:var(--bad)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.choices .btn{text-align:left}
.choices .btn[aria-pressed="true"]{border-color:var(--book);color:var(--book)}
.munsell{display:grid;gap:4px;justify-content:start}
.chipc{width:38px;height:30px;border:2px solid transparent;border-radius:2px;padding:0}
.chipc[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--hivis)}
.axis{font-family:var(--f-mono);font-size:11px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.compare{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.swatch{width:110px;height:80px;border:1px solid var(--line);border-radius:3px}
input[type=range]{width:100%;accent-color:var(--hivis)}
select,input[type=number]{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:5px;font:inherit;font-size:13px;max-width:100%}

/* toasts */
.toasts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;max-width:min(380px,calc(100vw - 24px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--radar);padding:9px 12px;font-family:var(--f-mono);font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.bad{border-left-color:var(--bad)}.toast.hv{border-left-color:var(--hivis)}
.big{font-family:var(--f-display);font-size:40px;color:var(--hivis);line-height:1}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="hud" id="hud"></header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Game sections"></nav>
  <main class="view" id="view"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   GROUND TRUTH: TASMANIA — engineering geology edu-tainment
   ============================================================ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const r1=v=>Math.round(v*10)/10;
const money=v=>(v<0?'-':'')+'$'+Math.abs(Math.round(v)).toLocaleString('en-AU');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Munsell → sRGB (approximate, via CIELCh) ---------- */
const HUES=['2.5YR','5YR','7.5YR','10YR','2.5Y','5Y'];
const HUE_ANG={'2.5YR':45,'5YR':54,'7.5YR':63,'10YR':72,'2.5Y':82,'5Y':92};
function munsellRGB(h,v,c){
  const L=v*10.3-2,C=c*5.6,a=C*Math.cos(HUE_ANG[h]*Math.PI/180),b=C*Math.sin(HUE_ANG[h]*Math.PI/180);
  const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200,f=t=>t>6/29?t*t*t:3*(6/29)**2*(t-4/29);
  const X=.95047*f(fx),Y=f(fy),Z=1.08883*f(fz);
  const lin=[3.2406*X-1.5372*Y-.4986*Z,-.9689*X+1.8758*Y+.0415*Z,.0557*X-.204*Y+1.057*Z];
  const g=u=>clamp(Math.round(255*(u<=.0031308?12.92*u:1.055*Math.pow(u,1/2.4)-.055)),0,255);
  return `rgb(${lin.map(g).join(',')})`;
}
function munsellName(h,v,c){
  const Y=h.endsWith('Y')&&!h.endsWith('YR');
  if(c<=1){return v<=2?'black':v<=3?'very dark grey':v<=4?'dark grey':v<=6?'grey':v<=7?'light grey':'white'}
  if(Y){ if(c<=2) return v<=3?'dark olive grey':v<=5?'olive grey':'light olive grey';
         if(c<=4) return v<=5?'olive':'pale olive'; return 'olive yellow'; }
  if(c<=2) return v<=2?'black':v<=3?'very dark greyish brown':v<=4?'dark greyish brown':v<=5?'greyish brown':v<=6?'light brownish grey':'light grey';
  if(c<=4){ if(h==='2.5YR') return v<=3?'dark reddish brown':v<=5?'reddish brown':'light reddish brown';
            if(h==='5YR') return v<=3?'dark reddish brown':v<=5?'reddish brown':'light reddish brown';
            return v<=3?'dark brown':v<=5?'brown':v<=6?'pale brown':'very pale brown'; }
  if(h==='10YR') return v<=4?'dark yellowish brown':v<=5?'yellowish brown':v<=6?'brownish yellow':'yellow';
  if(h==='7.5YR') return v<=5?'strong brown':'reddish yellow';
  if(h==='5YR') return v<=3?'dark reddish brown':v<=5?'yellowish red':'reddish yellow';
  return v<=3?'dark red':v<=5?'red':'light red';
}
const munStr=m=>m?`${m.h} ${m.v}/${m.c}`:'—';

/* ---------- Field texture grades (after the Australian Soil & Land Survey Field Handbook) ---------- */
const TEX=[
  {k:'S',  n:'Sand',            r:0,  rr:'nil',     feel:'Loose grains, no coherence; won’t form a bolus.'},
  {k:'LS', n:'Loamy sand',      r:5,  rr:'~5 mm',   feel:'Gritty, barely coherent; just ribbons.'},
  {k:'CS', n:'Clayey sand',     r:10, rr:'5–15 mm', feel:'Gritty and slightly sticky; sand grains obvious.'},
  {k:'SL', n:'Sandy loam',      r:20, rr:'15–25 mm',feel:'Gritty but coherent; short ribbon.'},
  {k:'L',  n:'Loam',            r:25, rr:'~25 mm',  feel:'Smooth and spongy; no obvious grit or stickiness.'},
  {k:'SCL',n:'Sandy clay loam', r:32, rr:'25–40 mm',feel:'Firm bolus, sandy to touch, medium-size grains visible.'},
  {k:'CL', n:'Clay loam',       r:45, rr:'40–50 mm',feel:'Smooth, slightly plastic.'},
  {k:'LC', n:'Light clay',      r:62, rr:'50–75 mm',feel:'Plastic and smooth; slight resistance to shearing.'},
  {k:'MC', n:'Medium clay',     r:80, rr:'> 75 mm', feel:'Handles like plasticine; moderate resistance.'},
  {k:'HC', n:'Heavy clay',      r:88, rr:'> 75 mm', feel:'Handles like stiff plasticine; firm resistance to ribboning.'},
];
const texIdx=k=>TEX.findIndex(t=>t.k===k);
const SANDY=['S','LS','CS'];

/* ---------- Geology / profile generators ---------- */
const mu=(h,v,c)=>({h,v,c});
function L(desc,tex,mun,LL,PL,LS,dcp,top,bot,x={}){
  return Object.assign({desc,tex,mun,LL:LL==null?null:r1(LL),PL:PL==null?null:r1(PL),LS:r1(LS),dcp,top:r1(top),bot:r1(bot)},x);
}
const GEO={
  dolerite:{name:'Jurassic dolerite (Jd)',diff:1,note:'Residual clays over dolerite. Hobart’s favourite reactive soil. Watch for dolerite floaters (boulders).',
    gen(){const a=rnd(.15,.3),b=a+rnd(1.0,1.6),r=b+rnd(.3,.9);return{layers:[
      L('Topsoil: clay loam, organic, rootlets','CL',mu('10YR',3,2),rnd(33,39),rnd(19,23),rnd(6,8),3,0,a),
      L('Residual soil: high plasticity clay derived from dolerite','HC',pick([mu('7.5YR',4,4),mu('10YR',4,3),mu('7.5YR',5,6)]),rnd(62,76),rnd(23,28),rnd(14,19),6,a,b),
      L('Extremely weathered dolerite: gravelly clay','CL',mu('10YR',5,6),rnd(40,48),rnd(19,23),rnd(8,10),14,b,3.2)],
      rock:r,rockName:'dolerite',floaterP:.38,flagP:null}}},
  basalt:{name:'Tertiary basalt (Tb)',diff:2,note:'Black cracking clays. Shrink-swell monsters. Expect deep, highly reactive profiles.',
    gen(){const a=rnd(.2,.35),b=a+rnd(1.7,2.3);return{layers:[
      L('Topsoil: black clay, cracking, self-mulching','MC',mu('10YR',2,1),rnd(58,66),rnd(22,26),rnd(13,16),3,0,a),
      L('Residual basalt clay: very high plasticity, slickensided','HC',mu('10YR',3,1),rnd(80,94),rnd(26,31),rnd(19,23),5,a,b),
      L('Highly weathered basalt: silty clay','CL',mu('2.5Y',5,4),rnd(46,54),rnd(22,26),rnd(10,12),12,b,3.2)],
      rock:b+rnd(.6,1.2),rockName:'basalt',floaterP:.15,flagP:null}}},
  krasnozem:{name:'Tertiary basalt: Ferrosol (krasnozem)',diff:2,note:'Deep red Ferrosols. High liquid limit, but also a high plastic limit. Don’t judge by LL alone.',
    gen(){const a=rnd(.2,.35);return{layers:[
      L('Topsoil: clay loam, friable, red-brown','CL',mu('5YR',3,3),rnd(48,55),rnd(32,36),rnd(6,8),2,0,a),
      L('Ferrosol clay: well structured, friable, red','LC',mu('2.5YR',3,6),rnd(57,67),rnd(35,41),rnd(8,11),4,a,3.2)],
      rock:rnd(3.3,5),rockName:'basalt',floaterP:.1,flagP:null}}},
  tertiary:{name:'Tertiary sediments (Ts)',diff:2,note:'Sandy clays over grey mottled clays. Launceston’s Tertiary sediments host many mapped landslides.',
    gen(){const a=rnd(.25,.4),b=a+rnd(.6,1.0);const slip=Math.random()<.4;return{layers:[
      L('Topsoil: sandy loam','SL',mu('10YR',4,2),rnd(23,28),rnd(16,19),rnd(2,4),2,0,a),
      L('Sandy clay: medium plasticity, mottled','LC',mu('10YR',6,4),rnd(44,52),rnd(18,22),rnd(10,12),5,a,b),
      L('Clay: high plasticity, grey mottled orange','MC',mu('5Y',6,2),rnd(58,66),rnd(21,25),rnd(14,16),7,b,3.2)],
      rock:rnd(3.3,5),rockName:'siltstone',floaterP:0,flagP:slip?'landslip':null}}},
  granite:{name:'Devonian granite (Dg)',diff:1,note:'Coastal sands over decomposed granite. Corestones (granite boulders) can fake refusal.',
    gen(){const a=rnd(.2,.3),b=a+rnd(.6,1.0),r=b+rnd(.4,1.2);return{layers:[
      L('Topsoil: loamy sand, dark','LS',mu('10YR',3,2),null,null,rnd(0,1),2,0,a),
      L('Sand: fine to coarse, loose to medium dense','S',mu('10YR',6,3),null,null,rnd(0,.5),3,a,b),
      L('Decomposed granite: clayey sand','CS',mu('10YR',7,4),rnd(22,27),rnd(15,18),rnd(2,4),10,b,3.2)],
      rock:r,rockName:'granite',floaterP:.28,flagP:null}}},
  triassic:{name:'Triassic sandstone (Rs)',diff:1,note:'Silty clays over weathered sandstone; rock is often shallow.',
    gen(){const a=rnd(.2,.3),b=a+rnd(.6,1.0),r=b+rnd(.2,.7);return{layers:[

function distKm(a,b){return Math.max(6,Math.hypot((a.lon-b.lon)*82,(a.lat-b.lat)*111)*1.28)}
function locObj(){return S.loc==='HQ'?HQ:site(S.loc)}

function newGame(){

  S.contracts.push(genContract('Glenorchy'));S.contracts.push(genContract('Kingston'));S.contracts.push(genContract());
  eva('Command console online. Welcome to Tasmania.');
}
function genContract(force){
  const busy=new Set(S.contracts.filter(c=>!['done','failed'].includes(c.status)).map(c=>c.town));
  let pool=force?SITES.filter(s=>s.n===force):SITES.filter(s=>!busy.has(s.n));
  if(!pool.length) pool=SITES;
  const s=pick(pool),G=GEO[s.geo],dist=distKm(HQ,s),bh=rint(2,3);
  const fee=Math.round((1500+dist*5.5+G.diff*450+bh*250)*rnd(.9,1.15)/10)*10;
  const prof=G.gen();
  const notes=[`Desk study: MRT geology map shows ${G.name}.`,G.note];
  if(prof.flagP==='landslip') notes.push('Lot sits on a 12° slope. MRT landslide hazard mapping shows a “Medium” hazard band. Hummocky ground reported up-slope.');
  if(prof.flagP==='fill') notes.push('Historic aerials show the lot was a mine waste dump in the 1960s.');
  if(prof.flagP==='soft') notes.push('Client says the lawn “wobbles a bit” after rain.');
  return {id:S.nextId++,town:s.n,geo:s.geo,client:pick(CLIENTS),fee,bh,
    deadline:(S.t/1440|0)+1+rint(4,6)+Math.ceil(dist/180),repReq:(G.diff-1)*16+rint(0,8),
    status:'offered',byda:null,prof,notes,site:null,bhs:[],logs:null,lab:null,penalties:[],planned:false,ovenEnd:0,ovenStart:0};
}

/* ---------- Feed, toasts ---------- */
function eva(msg){S.feed.unshift({d:day(),t:clock(S.t),m:msg});S.feed=S.feed.slice(0,40)}
function toast(msg,kind=''){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;const tb=$('#toasts');tb.appendChild(d);while(tb.children.length>3)tb.firstChild.remove();setTimeout(()=>d.remove(),kind==='bad'?6500:4200)}
function say(msg,kind){eva(msg);toast(msg,kind)}

/* ---------- Time ---------- */
function canSpend(m,kind){return tod()+m<=LIMIT[kind]}
function need(m,kind,what){
  if(canSpend(m,kind)) return true;
  const lim={field:'daylight (field work stops at 18:00)',lab:'hours (the lab shuts at 22:00)',drive:'hours today (no driving past midnight)'}[kind];
  toast(`Not enough ${lim} for ${what}: needs ${dur(m)}, it’s ${clock(S.t)}. End the day or do something shorter.`,'bad');return false;
}
function spend(m){S.t+=Math.round(m);ovens();save()}
function ovens(){
  S.contracts.forEach(c=>{
    if((c.status==='oven1'||c.status==='oven2')&&S.t>=c.ovenEnd){
      c.status=c.status==='oven1'?'prep':'measure';
      eva(`#${c.id} ${c.town}: oven cycle complete. Samples ready.`);
    }
  });
}
function endDay(){
  const away=S.loc!=='HQ';
  const d=day();
  S.t=d*1440+420;
  let cost=wages(); const lines=[];
  if(cost) lines.push(`Crew wages ${money(cost)}`);
  if(away){cost+=140;lines.push('Motel in '+S.loc+' $140')}
  if(d%7===0){cost+=450;lines.push('Weekly living expenses (rent, groceries, a slab for the crew) $450')}
  S.money-=cost;
  // overnight oven gremlins
  S.contracts.forEach(c=>{if((c.status==='oven1'||c.status==='oven2')&&Math.random()<.06*maintF()){c.ovenEnd+=360;lines.push(`#${c.id}: the oven tripped the breaker overnight. +6 h on the cycle.`)}});
  // expire contracts
  S.contracts.forEach(c=>{
    if(c.status==='offered'&&c.deadline-2<day()){c.status='gone'}
    else if(!['done','failed','gone','offered'].includes(c.status)&&c.deadline<day()){c.status='failed';S.rep=clamp(S.rep-10,0,100);S.stats.failed++;lines.push(`#${c.id} ${c.town}: deadline missed. Contract lost. −10 reputation.`)}
  });
  S.contracts=S.contracts.filter(c=>c.status!=='gone'||false);
  const offered=S.contracts.filter(c=>c.status==='offered').length;
  const n=Math.min(rint(1,2),6-offered);
  for(let i=0;i<n;i++) S.contracts.push(genContract());
  ovens();
  eva(`Day ${day()} begins. ${lines.join(' · ')||'Quiet night.'}`);
  showModal(`<div class="sub">Day ${day()} · 07:00</div><h2>New day</h2>
    <ul>${lines.map(l=>`<li>${esc(l)}</li>`).join('')||'<li>Quiet night. The ovens hummed.</li>'}</ul>
    <p class="dim">${n} new contract${n===1?'':'s'} on the map. Balance ${money(S.money)}.</p>
    <div class="row"><button class="btn go" data-act="closeModal">Get to work</button></div>`);
  checkOver();render();
}
function checkOver(){
  if(S.money<-2500||S.rep<=0){S.over=true;

}

/* ---------- Fog of war ---------- */
const kmRaw=(a,b)=>Math.hypot((a.lon-b.lon)*82,(a.lat-b.lat)*111);
const scouted=s=>S.seen.some(p=>kmRaw(p,s)<p.r*.85);
const fogged=s=>S.fog&&!scouted(s);
function reveal(from,to){
  const km=kmRaw(from,to),n=Math.ceil(km/25),add=(lon,lat,r)=>{if(!S.seen.some(p=>p.r>=r&&kmRaw(p,{lon,lat})<10))S.seen.push({lon,lat,r})};
  const was=SITES.filter(scouted).length;
  for(let i=1;i<n;i++)add(from.lon+(to.lon-from.lon)*i/n,from.lat+(to.lat-from.lat)*i/n,22);
  add(to.lon,to.lat,55);
  const now=SITES.filter(scouted).length;
  if(S.fog&&now>was)toast(`Area scouted: ${now-was} more town${now-was>1?'s':''} revealed.`,'hv');
}
function fogLayer(){
  if(!S.fog)return'';

  return`<defs><filter id="fogblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>

    <mask id="fogmask" maskUnits="userSpaceOnUse" x="0" y="0" width="580" height="600"><rect width="580" height="600" fill="#fff"/><g filter="url(#fogblur)">${holes}</g></mask></defs>

}

function drive(arg){
  const to=arg==='HQ'?HQ:site(C(arg).town),name=arg==='HQ'?'HQ':C(arg).town;
  if(S.loc===name) return;
  let m=driveMin(to);
  if(!need(m,'drive','the drive')) return;
  const ev=[];
  if(Math.random()<gear('ute').bd*maintF()){m+=skill('m')>=2?20:60;S.money-=120;ev.push(skill('m')>=2?`Flat tyre. ${best('m').n} swaps it in 20 min.`:'The ute breaks down. Roadside assist, an hour and $120.')}
  const r=Math.random();
  if(r<.12){m+=30;ev.push('Roadworks on the highway. Stop/Slow lollipop for 30 min.')}
  else if(r<.2){m+=5;ev.push('A wombat crosses the road extremely slowly. Worth it.')}
  else if(r<.26){m+=15;ev.push('Stuck behind a log truck up the hill.')}
  if(tod()+m>20*60&&Math.random()<.25){S.money-=480;ev.push('Night driving: you clip a wallaby. Bull bar dented, $480. Poor wallaby.')}
  const km=distKm(locObj(),to);S.money-=km*.3;
  reveal(locObj(),to);
  spend(m);S.loc=name;
  let unloaded=0;
  if(name==='HQ'){S.contracts.forEach(c=>{if(c.status==='fieldDone'){c.status='atLab';unloaded++}})}
  say(`Arrived at ${name==='HQ'?'Moonah HQ':name} (${dur(m)}, fuel ${money(km*.3)}).${unloaded?` ${unloaded} contract sample set${unloaded>1?'s':''} unloaded to the lab.`:''}`);
  ev.forEach(e=>toast(e,'hv'));ev.forEach(eva);
  S.tab=name==='HQ'?(unloaded?'lab':'map'):'site';

const GW=16,GH=10,CS=30;
function genSite(c){
  const fw=rint(6,8),fh=rint(4,5),fx=rint(3,GW-fw-3),fy=rint(2,GH-fh-2);
  const left=Math.random()<.5,shed={x:left?1:GW-3,y:1,w:2,h:2};
  const sx=left?shed.x+1:shed.x,sy=shed.y+shed.h;
  const path=(x1,y1,x2,y2,vFirst=true)=>{const cs=[[x1,y1]];let x=x1,y=y1;
    const v=()=>{while(y!==y2){y+=Math.sign(y2-y);cs.push([x,y])}},h=()=>{while(x!==x2){x+=Math.sign(x2-x);cs.push([x,y])}};
    if(vFirst){v();h()}else{h();v()}return cs};
  const fronts=[];while(fronts.length<4){const v=rint(1,GW-2);if(!fronts.includes(v)&&Math.abs(v-sx)>0)fronts.push(v)}
  const [wm,pp,np,sw]=fronts;
  const svc=[];
  const sewRear=Math.random()<.6;
  svc.push({t:'sewer',cells:sewRear?Array.from({length:GW},(_,x)=>[x,0]):Array.from({length:GH},(_,y)=>[left?GW-1:0,y]),reg:true,loc:false,depth:rnd(.7,1.1)});
  svc.push({t:'water',cells:[[wm,GH-1]],reg:true,loc:true,depth:.45});
  svc.push({t:'water',cells:path(wm,GH-1,sx,sy,Math.random()<.5),reg:false,loc:Math.random()<.5,depth:rnd(.3,.5),priv:true});
  svc.push({t:'power',cells:path(pp,GH-1,sx,sy,Math.random()<.5),reg:false,loc:true,depth:rnd(.4,.6),priv:true});
  svc.push({t:'telecom',cells:path(np,GH-1,sx,sy,Math.random()<.5),reg:true,loc:true,depth:rnd(.3,.45)});
  svc.push({t:'storm',cells:path(sx,sy,sw,GH-1,false),reg:false,loc:false,depth:rnd(.25,.4),priv:true});
  svc.forEach(s=>{if(s.reg){const o=Math.random()<.4?pick([[1,0],[-1,0],[0,1],[0,-1]]):[0,0];s.off=o}});
  c.site={fp:{x:fx,y:fy,w:fw,h:fh},shed,feat:{wm,pp,np,sw,io:sewRear?[sx,1]:[left?GW-2:1,sy]},svc,located:false,revealed:[]};
}
const svcAt=(c,x,y)=>c.site.svc.find(s=>s.cells.some(([a,b])=>a===x&&b===y));
const inFP=(c,x,y,pad=0)=>{const f=c.site.fp;return x>=f.x-pad&&x<f.x+f.w+pad&&y>=f.y-pad&&y<f.y+f.h+pad};
const inShed=(c,x,y)=>{const s=c.site.shed;return x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h};

function drawPlan(ctx,c,hover){
  const W=GW*CS,H=(GH+1.6)*CS,st=c.site;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#24382a';ctx.fillRect(0,0,W,GH*CS);
  // grass texture
  for(let i=0;i<260;i++){const x=(i*73)%W,y=(i*131)%(GH*CS);ctx.fillStyle=i%2?'#2a4130':'#203325';ctx.fillRect(x,y,2,2)}
  if(c.prof.flagP==='landslip'){ctx.strokeStyle='rgba(239,219,114,.35)';ctx.lineWidth=1.2;for(let k=0;k<4;k++){ctx.beginPath();for(let x=0;x<W;x+=6)ctx.lineTo(x,14+k*9+Math.sin(x/14+k)*3);ctx.stroke()}ctx.fillStyle='rgba(239,219,114,.7)';ctx.font='10px IBM Plex Mono';ctx.fillText('hummocky ground, tension cracks ↑',W-230,58)}
  if(c.prof.flagP==='fill'){for(let i=0;i<90;i++){ctx.fillStyle=['#6b5a48','#8a7b6a','#4d4038','#9a3d2a'][i%4];ctx.fillRect((i*97)%W,(i*53)%(GH*CS),3,3)}ctx.fillStyle='rgba(239,219,114,.75)';ctx.font='10px IBM Plex Mono';ctx.fillText('bricks & slag poking through the grass',8,GH*CS-40)}
  if(c.prof.flagP==='soft'){ctx.fillStyle='rgba(74,163,255,.18)';ctx.beginPath();ctx.ellipse(W*.6,GH*CS*.45,120,50,0,0,7);ctx.fill();ctx.fillStyle='rgba(239,219,114,.75)';ctx.font='10px IBM Plex Mono';ctx.fillText('soggy, reeds',W*.6-30,GH*CS*.45)}
  // grid
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;for(let x=0;x<=GW;x++){ctx.beginPath();ctx.moveTo(x*CS,0);ctx.lineTo(x*CS,GH*CS);ctx.stroke()}for(let y=0;y<=GH;y++){ctx.beginPath();ctx.moveTo(0,y*CS);ctx.lineTo(W,y*CS);ctx.stroke()}
  // road
  ctx.fillStyle='#3a3f3d';ctx.fillRect(0,GH*CS+10,W,H-GH*CS-10);ctx.fillStyle='#6d7270';ctx.fillRect(0,GH*CS+8,W,3);
  ctx.strokeStyle='#efdb72';ctx.setLineDash([14,12]);ctx.beginPath();ctx.moveTo(0,H-12);ctx.lineTo(W,H-12);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#93a69e';ctx.font='10px IBM Plex Mono';ctx.fillText('STREET',6,H-18);
  // boundary
  ctx.strokeStyle='#cfd8d3';ctx.setLineDash([6,4]);ctx.strokeRect(1,1,W-2,GH*CS-2);ctx.setLineDash([]);
  // footprint
  const f=st.fp;ctx.fillStyle='rgba(255,155,48,.08)';ctx.fillRect(f.x*CS,f.y*CS,f.w*CS,f.h*CS);ctx.strokeStyle='#ff9b30';ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.strokeRect(f.x*CS,f.y*CS,f.w*CS,f.h*CS);ctx.setLineDash([]);
  ctx.fillStyle='#ff9b30';ctx.font='600 11px IBM Plex Sans Condensed';ctx.fillText('PROPOSED DWELLING',f.x*CS+6,f.y*CS+15);
  // shed
  const s=st.shed;ctx.fillStyle='#5b4632';ctx.fillRect(s.x*CS,s.y*CS,s.w*CS,s.h*CS);ctx.strokeStyle='#8c6c4c';ctx.strokeRect(s.x*CS,s.y*CS,s.w*CS,s.h*CS);
  ctx.fillStyle='#e9d9c4';ctx.font='10px IBM Plex Mono';ctx.fillText('old shed',s.x*CS+4,s.y*CS+14);
  // surface features
  const ft=st.feat,cx=x=>x*CS+CS/2;
  const box=(x,y,col,lab)=>{ctx.fillStyle=col;ctx.fillRect(cx(x)-7,y*CS+CS-12,14,10);ctx.fillStyle='#0b1211';ctx.font='bold 8px IBM Plex Mono';ctx.fillText(lab,cx(x)-6,y*CS+CS-4)};
  box(ft.wm,GH-1,'#4aa3ff','WM');box(ft.pp,GH-1,'#9aa3a0','PIL');box(ft.np,GH-1,'#cfcfcf','NBN');
  ctx.fillStyle='#e7d9ad';ctx.beginPath();ctx.arc(cx(ft.io[0]),ft.io[1]*CS+CS/2,6,0,7);ctx.fill();ctx.fillStyle='#0b1211';ctx.font='bold 7px IBM Plex Mono';ctx.fillText('IO',cx(ft.io[0])-5,ft.io[1]*CS+CS/2+3);
  ctx.fillStyle='#9fb4b0';ctx.fillRect(cx(ft.sw)-5,GH*CS+2,10,6);
  // services
  const line=(cells,col,dash,off=[0,0],w=3)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();cells.forEach(([x,y],i)=>{const X=(x+off[0])*CS+CS/2,Y=(y+off[1])*CS+CS/2;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});if(cells.length===1){const[x,y]=cells[0];ctx.moveTo((x+off[0])*CS+CS/2,(y+off[1])*CS+CS/2);ctx.lineTo((x+off[0])*CS+CS/2,GH*CS+8)}ctx.stroke();ctx.setLineDash([])};
  const bydaOn=c.byda!=null&&S.t>=c.byda;
  if(bydaOn) st.svc.filter(v=>v.reg).forEach(v=>line(v.cells,SV[v.t].col,[3,5],v.off,2));
  if(st.located) st.svc.filter(v=>v.loc).forEach(v=>line(v.cells,SV[v.t].col,[],[0,0],3));
  st.revealed.forEach(i=>{const v=st.svc[i];line(v.cells,SV[v.t].col,[10,3],[0,0],4)});
  // BHs
  c.bhs.forEach((b,i)=>{const X=b.x*CS+CS/2,Y=b.y*CS+CS/2;
    const col=b.st==='blocked'?'#ff6455':b.st==='done'?'#8bd897':'#efdb72';
    ctx.fillStyle='#0b1211';ctx.beginPath();ctx.arc(X,Y,10,0,7);ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(X,Y,10,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(X-5,Y);ctx.lineTo(X+5,Y);ctx.moveTo(X,Y-5);ctx.lineTo(X,Y+5);ctx.stroke();
    ctx.fillStyle=col;ctx.font='600 11px IBM Plex Mono';ctx.fillText('BH'+(i+1),X+12,Y-8)});
  if(hover){ctx.strokeStyle='rgba(239,219,114,.8)';ctx.lineWidth=1;ctx.strokeRect(hover[0]*CS+1,hover[1]*CS+1,CS-2,CS-2)}
}

function renderSite(){
  const c=siteContract();if(!c){S.tab='map';return render()}
  if(!c.site){genSite(c)}
  const bydaOn=c.byda!=null&&S.t>=c.byda,planning=!c.planned;
  const allDone=c.bhs.length&&c.bhs.every(b=>b.st==='done'),allX=c.bhs.length&&c.bhs.every(b=>['extracted','done'].includes(b.st)||(b.st==='driven'));
  const fm=fieldMult();
  const reloc=S.reloc;
  const bhHTML=c.bhs.map((b,i)=>{
    const steps=[];
    if(b.st==='blocked') steps.push(`<span class="chip c-bad">Blocked</span><button class="btn sm" data-act="relocate" data-arg="${i}">${reloc===i?'Click the plan…':'Relocate'}</button>`);
    if(b.st==='planned'){
      if(!b.pot) steps.push(`<button class="btn sm" data-act="pothole" data-arg="${i}">Pothole to 0.5 m (${dur(20*fm)})</button>`);
      steps.push(`<button class="btn sm go" data-act="driver" data-arg="${i}">Drive tube</button>`);
      steps.push(`<button class="btn sm" data-act="relocate" data-arg="${i}">${reloc===i?'Click the plan…':'Move'}</button>`);
    }
    if(b.st==='driven') steps.push(`<button class="btn sm go" data-act="extract" data-arg="${i}">Extract tube (${dur(gear('extract').min*fm)})</button>`);
    if(b.st==='extracted') steps.push(`<button class="btn sm go" data-act="dcp" data-arg="${i}">Run DCP</button>`);
    if(b.st==='done') steps.push(`<span class="chip c-ok">Tube ${b.depth.toFixed(2)} m${b.ref!=null?' (refusal)':''} · DCP ${b.dcpRef!=null?'refusal '+b.dcpRef.toFixed(2)+' m':'to 2.0 m'}</span><button class="btn sm" data-act="core" data-arg="${i}">View core</button>`);
    if(b.st==='extracted') steps.push(`<button class="btn sm" data-act="core" data-arg="${i}">View core</button>`);
    return `<div class="bh"><header><b>BH${i+1}</b><span class="mono dim" style="font-size:12px">cell ${b.x},${b.y}${b.pot?' · potholed':''}${inFP(c,b.x,b.y,1)?'':' · <span class="c-hv">outside footprint</span>'}</span></header><div class="steps">${steps.join('')}</div></div>`}).join('');
  const logged=c.logs&&c.logs.done;
  const deep=deepest(c);
  $('#view').innerHTML=`<div class="sitegrid">
   <div><div class="planwrap"><canvas id="plan"></canvas></div>
    <div class="legend" style="margin-top:8px">${Object.entries(SV).map(([k,v])=>`<span style="--c:${v.col}">${v.n}</span>`).join('')}</div>
    <p class="dim" style="font-size:13px">Dashed thin lines are BYDA plans (indicative only, can be offset). Solid lines are your locator mark-out. Each grid cell is 2 m.</p></div>
   <div class="brief">
    <div class="card"><div class="eyebrow">Contract #${c.id} · ${esc(c.town)}</div><h3>${planning?'Plan your boreholes':'Field works'}</h3>
     ${planning?`<p>Click the plan to place <b>${c.bh}</b> borehole${c.bh>1?'s':''} (up to ${c.bh+1}). Put them inside or within 2 m of the proposed dwelling, and keep clear of services.</p>
      <div class="tip">Look for surface clues: water meter (WM), power pillar (PIL), NBN pit, sewer inspection opening (IO), shed downpipes. <b>BYDA only shows assets owned by utilities.</b> Private lines from the meter to the shed are on you.</div>
      <div class="row" style="margin-top:10px">
       ${bydaOn?'<span class="chip c-ok">BYDA plans shown</span>':c.byda!=null?`<span class="chip c-hv">BYDA plans arrive D${Math.floor(c.byda/1440)+1}</span>`:'<span class="chip c-bad">No BYDA lodged</span>'}
       ${S.gear.locator?`<button class="btn sm" data-act="sweep" ${c.site.located?'disabled':''}>${c.site.located?'Site swept':'Sweep with locator ('+dur(25*fm)+')'}</button>`:''}
       <button class="btn go" data-act="confirmBH" ${c.bhs.length>=c.bh?'':'disabled'}>Confirm locations</button></div>`:
     `<p class="dim">Pothole first if you’re unsure about services. Drive the tube, extract it, then run a DCP beside each hole. Field work stops at 18:00.</p>
      <div class="bhlist">${bhHTML}</div>
      <div class="row" style="margin-top:10px">
       <button class="btn ${logged?'':'go'}" data-act="logLayers" ${deep&&c.bhs.every(b=>['extracted','done'].includes(b.st))&&!logged?'':'disabled'}>${logged?'Layers logged ✓':'Log soil layers (ribbon + colour)'}</button>
       <button class="btn go" data-act="packUp" ${allDone&&logged?'':'disabled'}>Pack up & load samples (${dur(15*fm)})</button></div>`}
    </div>
    ${briefing(c)}
   </div></div>`;
  const cv=$('#plan'),ctx=setupCanvas(cv,GW*CS,(GH+1.6)*CS);drawPlan(ctx,c);
  cv.onpointermove=e=>{const[x,y]=cpos(cv,e,GW*CS);const gx=Math.floor(x/CS),gy=Math.floor(y/CS);drawPlan(ctx,c,gy<GH?[gx,gy]:null)};
  cv.onpointerleave=()=>drawPlan(ctx,c);
  cv.onclick=e=>{const[x,y]=cpos(cv,e,GW*CS);const gx=Math.floor(x/CS),gy=Math.floor(y/CS);if(gy>=GH||gx<0||gx>=GW)return;
    if(inShed(c,gx,gy)){toast('That’s the shed. The post driver won’t go through a concrete slab.','bad');return}
    if(planning){const i=c.bhs.findIndex(b=>b.x===gx&&b.y===gy);
      if(i>=0)c.bhs.splice(i,1);else if(c.bhs.length<c.bh+1)c.bhs.push(newBH(c,gx,gy));else toast(`Max ${c.bh+1} boreholes for this scope.`);
      renderSite();save();return}
    if(S.reloc!=null){const b=c.bhs[S.reloc];if(c.bhs.some(o=>o.x===gx&&o.y===gy)){toast('There’s already a borehole there.');return}
      Object.assign(b,newBH(c,gx,gy));S.reloc=null;toast(`BH moved to ${gx},${gy}.`);renderSite();save()}};
}
function newBH(c,x,y){const fp=c.prof.floaterP;return{x,y,st:'planned',pot:false,depth:0,ref:null,floater:Math.random()<fp?rnd(.5,Math.min(c.prof.rock,2.4)-.1):null,flBlows:rint(4,10),dcpRef:null,dcp:[]}}
function deepest(c){const ex=c.bhs.filter(b=>['extracted','done'].includes(b.st));return ex.length?ex.reduce((a,b)=>b.depth>a.depth?b:a):null}
function layersTo(c,d){return c.prof.layers.filter(l=>l.top<d-.02)}
function layerAt(c,d){return c.prof.layers.find(l=>d>=l.top&&d<l.bot)||c.prof.layers[c.prof.layers.length-1]}

Object.assign(ACT,{
  relocate(i){S.reloc=S.reloc===+i?null:+i;renderSite()},
  sweep(){const c=siteContract(),m=25*fieldMult();if(!need(m,'field','a locator sweep'))return;spend(m);c.site.located=true;
    say('Locator sweep done. Live cables and metallic pipes marked in paint. PVC and clay pipes don’t show up on a locator.');render()},
  confirmBH(){const c=siteContract();const out=c.bhs.filter(b=>!inFP(c,b.x,b.y,1)).length;
    const inside=c.bhs.length-out;
    if(inside<c.bh){toast(`At least ${c.bh} boreholes need to be within 2 m of the proposed dwelling or the engineer will bounce your report.`,'bad');return}
    const m=20*fieldMult();if(!need(m,'field','site set-up'))return;spend(m);c.planned=true;
    eva(`${c.town}: site set up. Induction done, cones out, ute parked off the lawn.`);render()},
  pothole(i){const c=siteContract(),b=c.bhs[+i],m=20*fieldMult();if(!need(m,'field','potholing'))return;spend(m);b.pot=true;
    const s=svcAt(c,b.x,b.y);
    if(s&&s.depth<=.6){b.st='blocked';c.site.revealed.push(c.site.svc.indexOf(s));say(`Potholing BH${+i+1}: exposed a ${SV[s.t].n} at ${s.depth.toFixed(2)} m. Nice catch. Relocate the borehole.`,'hv')}
    else say(`BH${+i+1} potholed to 0.5 m. All clear.`);render()},
  driver(i){const c=siteContract();if(!need(25*fieldMult(),'field','driving a tube'))return;mgDriver(c,+i)},
  extract(i){const c=siteContract(),b=c.bhs[+i],m=gear('extract').min*fieldMult();if(!need(m,'field','tube extraction'))return;spend(m);b.st='extracted';
    eva(`BH${+i+1} tube extracted (${dur(m)}).`);coreModal(c,+i)},
  dcp(i){const c=siteContract();if(!need(15*fieldMult(),'field','a DCP test'))return;mgDCP(c,+i)},
  core(i){coreModal(siteContract(),+i)},
  logLayers(){const c=siteContract();logFlow(c)},
  packUp(){const c=siteContract(),m=15*fieldMult();if(!need(m,'field','packing up'))return;spend(m);
    c.status='fieldDone';c.samples=c.bhs.reduce((a,b)=>a+layersTo(c,b.depth).length,0);
    say(`${c.town}: ${c.samples} samples bagged, labelled and in the esky. Drive them back to HQ.`);S.tab='map';S.sel=c.id;render()},
});

/* ---------- Strike! ---------- */
function strike(c,i,s){
  const b=c.bhs[i],v=SV[s.t];b.st='blocked';b.depth=0;
  c.site.revealed.push(c.site.svc.indexOf(s));S.money-=v.cost;S.rep=clamp(S.rep-v.rep,0,100);S.stats.strikes++;
  c.penalties.push(`Struck a ${v.n} at BH${i+1} (${money(v.cost)}, −${v.rep} rep)`);
  spend(v.min*.5);
  showModal(`<div class="sub">Incident · BH${i+1}</div><h2 class="c-bad">Service strike!</h2><p style="font-size:17px">${esc(v.msg)}</p>
   <p class="mono">Repairs ${money(v.cost)} · Reputation −${v.rep} · Lost time ${dur(v.min*.5)}</p>
   <div class="tip">${s.priv?'This was a <b>private</b> service. BYDA doesn’t show private services; they run from the meter or pillar to buildings. Trace them from the surface clues, use a locator, or pothole first.':s.loc?'A locator sweep would have found this one. BYDA plans are indicative and can be off by metres.':'Non-metallic pipes don’t show on a locator. Potholing (non-destructive digging) to 0.5 m is the only sure way.'}</div>
   <div class="row"><button class="btn go" data-act="closeModal">Relocate the borehole</button></div>`);
  checkOver();
}

/* ---------- Minigame: Christie post driver ---------- */
function mgDriver(c,i){
  const b=c.bhs[i],G=gear('driver'),fm=fieldMult(),fs=skill('f');
  let depth=0,strikes=0,phase=Math.random()*6,jam=false,stop=null,flash=0,hit=0,setupPaid=false;
  const target=2.5;const svc=b.pot?null:svcAt(c,b.x,b.y);
  const obs=()=>Math.min(b.floater??9,c.prof.rock);
  showModal(`<div class="sub">BH${i+1} · ${esc(G.n)}</div><h2>Drive the push tube</h2>
    <div class="tip">Strike when the needle is in the <b style="color:var(--radar)">green</b>; the bright centre gives the biggest push. Target: 2.5 m. If it bounces, you’ve met refusal: rock or a floater (a boulder). Space bar works too.</div>
    <canvas id="pd"></canvas><div class="msg" id="pdmsg">Tube on, driver on, ear muffs on.</div>
    <div class="row"><button class="btn go" id="pdStrike">STRIKE</button><button class="btn" id="pdStop">Stop here & keep sample</button><span class="mono dim" id="pdStat"></span></div>`,()=>{stopLoop();document.removeEventListener('keydown',key)});
  const cv=$('#pd'),ctx=setupCanvas(cv,560,300),msg=$('#pdmsg');
  const finish=(why)=>{stopLoop();const m=(10+strikes*.5)*fm;spend(m);b.depth=r1(depth*100)/100;
    if(why==='strike'){return}
    b.st='driven';b.ref=why==='refusal'?b.depth:null;
    eva(`BH${i+1}: tube driven to ${b.depth.toFixed(2)} m in ${strikes} strikes (${dur(m)}).`);
    closeModal()};
  const doStrike=()=>{
    if(jam||stop)return;strikes++;
    if(Math.random()<G.jam*maintF()){jam=true;const fix=skill('m')>=2?5:20;
      msg.className='msg bad';msg.innerHTML=`Driver jammed! ${skill('m')>=2?esc(best('m').n)+' clears it in 5 min.':'Clearing it yourself: 20 min.'} <button class="btn sm" id="unjam">Clear jam</button>`;
      $('#unjam').onclick=()=>{spend(fix*fm);jam=false;msg.className='msg';msg.textContent='Back in business.'};return}
    const p=(Math.sin(phase)+1)/2,q=Math.abs(p-.82)<.035?1.5:(p>.7&&p<.94)?1:.35;
    const lay=layerAt(c,depth);let adv=600/(lay.dcp+3)*G.adv*(1+.08*fs)*q/1000*rnd(.85,1.15);
    hit=q;flash=1;
    if(svc&&depth<svc.depth&&depth+adv>=svc.depth){depth=svc.depth;stopLoop();closeModal(true);finish('strike');strike(c,i,svc);render();return}
    if(depth+adv>=obs()){depth=obs();stop='refusal';const isF=b.floater!=null&&b.floater<c.prof.rock;
      msg.className='msg bad';msg.innerHTML=`BOUNCE. The tube won’t go any further at ${depth.toFixed(2)} m. Rock, or a floater?`;
      $('#pdStrike').disabled=true;
      $('#pdStop').textContent='Accept refusal';
      const row=document.createElement('div');row.className='row';
      row.innerHTML=`<button class="btn" id="pdOffset">Offset 0.5 m and re-drive (+15 min)</button>`;msg.after(row);
      $('#pdOffset').onclick=()=>{spend((10+strikes*.5+15)*fm);strikes=0;depth=0;stop=null;b.floater=Math.random()<.3?rnd(.5,Math.min(c.prof.rock,2.4)-.1):null;
        row.remove();$('#pdStrike').disabled=false;$('#pdStop').textContent='Stop here & keep sample';msg.className='msg';msg.textContent=isF?'New spot, fresh hole. Let’s see if that boulder’s gone…':'New spot, fresh hole.';};
      return}
    depth+=adv;
    if(depth>=target){depth=target;stop='target';msg.className='msg';msg.textContent='2.5 m reached. Beautiful.';$('#pdStrike').disabled=true;$('#pdStop').textContent='Finish';return}
    msg.className='msg';msg.textContent=q===1.5?'THUNK! Perfect strike.':q===1?'Solid hit.':'Glancing blow. Timing!';
    if(q===1.5){cv.classList.remove('shake');void cv.offsetWidth;cv.classList.add('shake')}
  };
  const key=e=>{if(e.code==='Space'){e.preventDefault();doStrike()}};document.addEventListener('keydown',key);
  $('#pdStrike').onclick=doStrike;
  $('#pdStop').onclick=()=>{if(depth<.3&&!stop){toast('You need at least 0.3 m of core to log anything.');return}finish(stop==='refusal'?'refusal':'stop')};
  loop(dt=>{
    if(!jam&&!stop)phase+=dt*(2.2+layerAt(c,depth).dcp*.08);
    flash=Math.max(0,flash-dt*3);
    ctx.clearRect(0,0,560,300);
    // ground section
    const gx=160,gy=70,sc=84;
    ctx.fillStyle='#0b1211';ctx.fillRect(0,0,560,300);
    c.prof.layers.forEach(l=>{const y1=gy+l.top*sc,y2=gy+Math.min(l.bot,2.6)*sc;ctx.fillStyle=depth>=l.top?munsellRGB(l.mun.h,l.mun.v,l.mun.c):'#24302c';ctx.fillRect(gx-70,y1,140,y2-y1)});
    ctx.fillStyle='#24382a';ctx.fillRect(gx-70,gy-6,140,6);
    // depth ruler
    ctx.fillStyle='#93a69e';ctx.font='10px IBM Plex Mono';for(let d=0;d<=2.5;d+=.5){ctx.fillRect(gx-82,gy+d*sc,8,1);ctx.fillText(d.toFixed(1),gx-112,gy+d*sc+3)}
    // tube
    const tubeLen=2.7*sc,top=gy+depth*sc-tubeLen;
    ctx.fillStyle='#b8c2bf';ctx.fillRect(gx-6,top,12,tubeLen);ctx.fillStyle='#6d7672';ctx.fillRect(gx-6,top,3,tubeLen);
    // driver
    const bounce=flash*10;ctx.fillStyle='#ff9b30';ctx.fillRect(gx-18,top-46-bounce,36,46);ctx.fillStyle='#1b1205';ctx.font='bold 9px IBM Plex Mono';ctx.fillText('CHRISTIE',gx-21+3,top-20-bounce);
    if(flash>.6){ctx.strokeStyle='#efdb72';ctx.lineWidth=2;for(let k=0;k<6;k++){const a=k/6*6.28;ctx.beginPath();ctx.moveTo(gx+Math.cos(a)*22,top+Math.sin(a)*8);ctx.lineTo(gx+Math.cos(a)*34,top+Math.sin(a)*12);ctx.stroke()}}
    // meter
    const mx=300,my=50,mw=230;ctx.fillStyle='#1d2826';ctx.fillRect(mx,my,mw,22);
    ctx.fillStyle='rgba(139,216,151,.45)';ctx.fillRect(mx+mw*.7,my,mw*.24,22);ctx.fillStyle='#8bd897';ctx.fillRect(mx+mw*.785,my,mw*.07,22);
    const p=(Math.sin(phase)+1)/2;ctx.fillStyle='#fff';ctx.fillRect(mx+p*mw-2,my-5,4,32);
    ctx.fillStyle='#93a69e';ctx.font='10px IBM Plex Mono';ctx.fillText('STRIKE POWER',mx,my-10);
    ctx.fillStyle='#e1e8e3';ctx.font='600 30px IBM Plex Mono';ctx.fillText(depth.toFixed(2)+' m',mx,my+80);
    ctx.font='12px IBM Plex Mono';ctx.fillStyle='#93a69e';ctx.fillText(`strikes ${strikes} · layer: ${layerAt(c,depth).desc.split(':')[0]}`,mx,my+102);
    ctx.fillText(`time so far ${dur((10+strikes*.5)*fm)}`,mx,my+120);
  });
}

/* ---------- Core viewer ---------- */
function coreModal(c,i){
  const b=c.bhs[i],ls=layersTo(c,b.depth);
  const rows=ls.map(l=>`<tr><td class="num">${l.top.toFixed(2)}–${Math.min(l.bot,b.depth).toFixed(2)} m</td><td>${esc(l.desc.split(':')[0])}</td><td><span style="display:inline-block;width:14px;height:14px;vertical-align:middle;background:${munsellRGB(l.mun.h,l.mun.v,l.mun.c)}"></span></td></tr>`).join('');
  showModal(`<div class="sub">BH${i+1} · core recovered to ${b.depth.toFixed(2)} m</div><h2>Split the tube</h2>
   <canvas id="corecv"></canvas>
   <div class="scroll"><table class="tbl"><thead><tr><th>Depth</th><th>Unit (by eye)</th><th>Colour</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="dim">${ls.length} sample bag${ls.length>1?'s':''} (one per layer) labelled ${c.town.slice(0,3).toUpperCase()}-BH${i+1}. Field descriptions come from your ribbon and colour logging.</p>
   <div class="row"><button class="btn go" data-act="closeModal">Bag it</button></div>`);
  const cv=$('#corecv'),ctx=setupCanvas(cv,600,90);ctx.fillStyle='#0b1211';ctx.fillRect(0,0,600,90);
  const sc=560/2.5;
  ls.forEach(l=>{const x1=20+l.top*sc,x2=20+Math.min(l.bot,b.depth)*sc;ctx.fillStyle=munsellRGB(l.mun.h,l.mun.v,l.mun.c);ctx.fillRect(x1,25,x2-x1,34);
    for(let k=0;k<(x2-x1)/3;k++){ctx.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},.08)`;ctx.fillRect(x1+Math.random()*(x2-x1),25+Math.random()*34,3,2)}
    if(l.fill){for(let k=0;k<12;k++){ctx.fillStyle=pick(['#9a3d2a','#cfd8d3','#3b3b3b']);ctx.fillRect(x1+Math.random()*(x2-x1),28+Math.random()*28,5,4)}}});
  ctx.strokeStyle='#b8c2bf';ctx.strokeRect(20,24,b.depth*sc,36);
  ctx.fillStyle='#93a69e';ctx.font='10px IBM Plex Mono';for(let d=0;d<=2.5;d+=.5){ctx.fillRect(20+d*sc,62,1,6);ctx.fillText(d.toFixed(1)+'m',20+d*sc-8,80)}
}

/* ---------- Minigame: DCP ---------- */
function mgDCP(c,i){
  const b=c.bhs[i],R=gear('rods'),fm=fieldMult();
  let d=0,blows=0,inInt=0,rec=[],obsBlows=0,bounces=0,broke=false,ended=false,lastPen=0,drop=0,stuck=false;
  const fl=b.floater!=null&&b.floater<c.prof.rock?b.floater*1000:null,rock=c.prof.rock*1000;
  showModal(`<div class="sub">BH${i+1} · AS 1289.6.3.2 · 9 kg hammer, 510 mm drop</div><h2>Dynamic Cone Penetrometer</h2>
   <div class="tip">Record blows per 100 mm to 2.0 m or refusal. Refusal is commonly called around <b>20+ blows/100 mm</b>, or when the hammer bounces (under ~5 mm per blow). Every bouncing blow risks getting the rods stuck. Is it bedrock, or a floater you could punch through?</div>
   <canvas id="dcpcv"></canvas><div class="msg" id="dmsg">Cone seated. Rods plumb.</div>
   <div class="row"><button class="btn go" id="dDrop">DROP HAMMER</button><button class="btn" id="d5">Drop ×5</button><button class="btn warn" id="dRef">Call refusal</button><span class="mono dim" id="dStat"></span></div>`,()=>{stopLoop();document.removeEventListener('keydown',key)});
  const cv=$('#dcpcv'),ctx=setupCanvas(cv,560,320),msg=$('#dmsg');
  const end=(why)=>{if(ended)return;ended=true;if(inInt)rec.push(inInt);const m=(10+blows*.3)*fm+(stuck?R.free:0);spend(m);
    b.dcp=rec;b.dcpRef=why==='target'?null:r1(d/10)/100;b.st='done';
    eva(`BH${i+1} DCP: ${why==='target'?'reached 2.0 m':'refusal at '+(d/1000).toFixed(2)+' m'} (${blows} blows, ${dur(m)}).`);
    $('#dDrop').disabled=$('#d5').disabled=true;$('#dRef').textContent='Close';$('#dRef').onclick=()=>closeModal()};
  const one=()=>{
    if(ended)return false;blows++;drop=1;
    const lay=layerAt(c,d/1000);let pen,note='';
    const onF=fl!=null&&!broke&&d>=fl-1,onR=d>=rock-1;
    if(onF||onR){pen=rnd(.5,3);bounces++;note=`Bounce… ${pen.toFixed(1)} mm.${bounces>=4?' Still bouncing.':''}`;
      if(onF){obsBlows++;if(obsBlows>=b.flBlows){broke=true;pen=rnd(25,45);note='CLUNK. It punched through! That was a floater (a boulder), not bedrock.'}}}
    else{pen=100/(lay.dcp*rnd(.8,1.25));note=`${pen.toFixed(0)} mm`;
      if(lay.dcp<1.3&&Math.random()<.4){pen+=60;note='The rods sank under the weight of the hammer alone. Very soft ground.'}
      const stopAt=(!broke&&fl!=null)?Math.min(fl,rock):rock;if(d<stopAt)pen=Math.min(pen,Math.max(.5,stopAt-d))}
    if(pen<5&&Math.random()<R.stuck*(1+obsBlows*.15)){stuck=true;
      const bent=Math.random()<.3;if(bent){S.money-=180;c.penalties.push('Bent a DCP rod ($180)')}
      msg.className='msg bad';msg.textContent=`Rods stuck! ${dur(R.free)} with the ${S.gear.rods?'rod puller':'jack and a lot of swearing'}${bent?'. One rod is bent: $180':''}. Test ends here.`;
      d+=pen;inInt++;end('refusal');return false}
    msg.className=pen<5?'msg bad':'msg';msg.textContent=note;
    lastPen=pen;
    const nd=d+pen;inInt++;
    while(nd>=(rec.length+1)*100&&rec.length<20){rec.push(inInt);inInt=0}
    d=Math.min(nd,2000);
    if(d>=2000){d=2000;msg.className='msg';msg.textContent='2.0 m reached. Test complete.';end('target');return false}
    return true};
  const key=e=>{if(e.code==='Space'){e.preventDefault();one()}};document.addEventListener('keydown',key);
  $('#dDrop').onclick=one;$('#d5').onclick=()=>{for(let k=0;k<5;k++)if(!one())break};
  $('#dRef').onclick=()=>{if(!ended){if(d<100){toast('You haven’t gone 100 mm yet.');return}end('refusal')}};
  loop(dt=>{drop=Math.max(0,drop-dt*4);

    const tip=gy+d/1000*sc;ctx.fillStyle='#cfd8d3';ctx.fillRect(gx-2,tip-sc*2.2,4,sc*2.2);ctx.beginPath();ctx.moveTo(gx-5,tip-4);ctx.lineTo(gx+5,tip-4);ctx.lineTo(gx,tip+4);ctx.fill();
    const hy=Math.max(0,tip-sc*2.2)-30-drop*24;ctx.fillStyle='#ff9b30';ctx.fillRect(gx-10,Math.max(4,hy),20,22);
    // table
    ctx.fillStyle='#e1e8e3';ctx.font='600 13px IBM Plex Mono';ctx.fillText('Depth (mm)   Blows/100 mm',220,26);
    ctx.font='12px IBM Plex Mono';
    for(let k=0;k<20;k++){const col=k<10?0:1,row=k%10,x=220+col*170,y=48+row*22;
      const v=k<rec.length?rec[k]:k===rec.length?inInt:null;
      ctx.fillStyle='#93a69e';ctx.fillText(`${String(k*100).padStart(4)}–${String((k+1)*100).padStart(4)}`,x,y);
      if(v!=null){ctx.fillStyle=v>=20?'#ff6455':v>=10?'#ff9b30':'#8bd897';ctx.fillText(String(v).padStart(3)+(k===rec.length&&!ended?' …':''),x+100,y);ctx.fillRect(x+128,y-8,Math.min(v,30)*1.2,6)}}
    $('#dStat').textContent=`${(d/1000).toFixed(2)} m · ${blows} blows · last ${lastPen.toFixed(1)} mm`;
  });
}

/* ---------- Field logging: ribbon + colour ---------- */
function logFlow(c){
  const deep=deepest(c),ls=layersTo(c,deep.depth);
  if(!c.logs)c.logs={layers:[],done:false,maxD:deep.depth};
  const idx=c.logs.layers.length;
  if(idx>=ls.length){c.logs.done=true;c.logs.maxD=deep.depth;say(`${c.town}: ${ls.length} layers logged.`);closeModal();return}
  const l=ls[idx],fs=best('f');
  const m=12*fieldMult();
  if(!need(m,'field','logging a layer'))return;
  showModal(`<div class="sub">Layer ${idx+1} of ${ls.length} · ${l.top.toFixed(2)}–${Math.min(l.bot,deep.depth).toFixed(2)} m</div><h2>Log this layer</h2>
    <p>${esc(l.fill?'Looks like fill. Bits of brick and slag mixed through it.':l.organic?'Dark, wet, and smells like a swamp.':'A fresh face of soil from the split tube.')}</p>
    <div class="row"><button class="btn go" id="lgMe">Do it myself (ribbon test, then colour chart)</button>
    ${fs&&fs.f>0?`<button class="btn" id="lgDel">Hand it to ${esc(fs.n)}</button>`:''}</div>`);
  $('#lgMe').onclick=()=>mgRibbon(c,l,idx,ls.length);
  if($('#lgDel'))$('#lgDel').onclick=()=>{spend(m);const p=.5+.15*fs.f;
    const ti=texIdx(l.tex),tex=Math.random()<p?l.tex:TEX[clamp(ti+pick([-1,1]),0,TEX.length-1)].k;
    const mun=Math.random()<p?{...l.mun}:{...l.mun,c:clamp(l.mun.c+pick([-1,1]),1,8)};
    c.logs.layers.push({tex,mun,rib:TEX[texIdx(tex)].r,by:fs.n});toast(`${fs.n} logs it as ${TEX[texIdx(tex)].n}, ${munStr(mun)}.`);logFlow(c)};
}
function mgRibbon(c,l,idx,n){
  const T=TEX[texIdx(l.tex)],sandy=SANDY.includes(l.tex)||l.tex==='S';

  const feelTxt=()=>w<3?'Dry and crumbly: won’t hold together.':w<5?'Holds together but cracks when you bend it.':w<=7?'Coherent bolus that just fails to stick to your fingers. ✓ Ideal.':w<=9?'Shiny and sticky. Getting too wet.':'Sloppy mess. Add some dry soil.';
  showModal(`<div class="sub">Field texture · layer ${idx+1}/${n}</div><h2>Ribbon test</h2>
   <div class="tip"><b>1.</b> Take a golf-ball-sized sample and work in water a few drops at a time until the bolus <i>just fails to stick to your fingers</i>. <b>2.</b> Knead it for 1–2 minutes to break down aggregates. <b>3.</b> Press it out between thumb and forefinger into a ribbon. Measure where it breaks, and notice the feel.</div>
   <canvas id="rib"></canvas>
   <div class="msg" id="rmsg">${feelTxt()}</div>
   <div class="row" id="rA"><button class="btn" id="rW">Add water (squeeze bottle)</button><button class="btn" id="rD">Add dry soil</button><button class="btn" id="rK">Knead (20 s)</button><span class="mono dim" id="rk">kneaded 0 s</span></div>
   <div class="row"><button class="btn go" id="rP">Hold to press ribbon</button><span class="mono" id="rL"></span></div>
   <div id="rChoose" hidden><p><b>Which field texture grade?</b> <span class="dim" id="rFeel"></span></p><div class="choices">${TEX.map(t=>`<button class="btn" data-tex="${t.k}"><b>${t.k}</b> ${t.n}<br><span class="dim" style="font-size:12px">ribbon ${t.rr}</span></button>`).join('')}</div>
   <div class="row" style="margin-top:8px"><button class="btn go" id="rOk" disabled>Record texture → colour chart</button></div></div>`,()=>{stopLoop()});
  const cv=$('#rib'),ctx=setupCanvas(cv,560,150),msg=$('#rmsg');
  const upd=()=>{msg.textContent=sandy&&w>=3?'The sand grains won’t hold a coherent bolus. Barely any cohesion.':feelTxt();$('#rk').textContent=`kneaded ${knead*20} s`};
  $('#rW').onclick=()=>{w++;upd()};$('#rD').onclick=()=>{w=Math.max(0,w-2);upd()};$('#rK').onclick=()=>{knead++;upd()};

  pb.onpointerdown=startP;pb.onpointerup=endP;pb.onpointerleave=endP;
  pb.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!pressing){startP(e)}};pb.onkeyup=e=>{if(e.key===' '||e.key==='Enter')endP()};
  const finishR=()=>{const L=r1(len);$('#rL').textContent=`Ribbon broke at ${L} mm`;
    if(!(w>=5&&w<=7))toast(w<5?'Too dry: the ribbon broke early. Your reading is short.':'Too wet: the ribbon smeared. Hard to read.','hv');
    if(knead<4)toast('Not kneaded enough: aggregates make the ribbon break early.','hv');
    $('#rFeel').textContent=`Feel: ${l.feel||T.feel}`;$('#rChoose').hidden=false;$('#rA').hidden=true;pb.disabled=true;

  sheet().querySelectorAll('[data-tex]').forEach(bt=>bt.onclick=()=>{chosen=bt.dataset.tex;sheet().querySelectorAll('[data-tex]').forEach(x=>x.setAttribute('aria-pressed',x===bt));$('#rOk').disabled=false});
  $('#rOk').onclick=()=>{const ok=chosen===l.tex,near=Math.abs(texIdx(chosen)-texIdx(l.tex))===1;
    toast(ok?`Spot on: ${T.n}.`:near?`Close. It was ${T.n} (${T.k}).`:`Hmm. It was ${T.n} (${T.k}). Ribbon ${T.rr}.`,ok?'':'hv');
    if(ok)S.stats.perfect++;
    mgColour(c,l,idx,n,chosen)};
  loop(dt=>{if(pressing&&!broke){len+=dt*14;if(len>=brk){len=brk;broke=true;pressing=false;finishR()}}
    ctx.fillStyle='#1d2826';ctx.fillRect(0,0,560,150);
    const col=munsellRGB(l.mun.h,l.mun.v,Math.max(1,l.mun.c));
    // thumb
    ctx.fillStyle='#c99a7b';ctx.beginPath();ctx.ellipse(70,70,48,34,0,0,7);ctx.fill();ctx.fillStyle='#e0b597';ctx.beginPath();ctx.ellipse(60,62,30,20,0,0,7);ctx.fill();
    // bolus
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(100,75,18-len/12,0,7);ctx.fill();
    // ribbon
    const px=4.5;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(110,66);ctx.lineTo(110+len*px,70+len*.25);ctx.lineTo(110+len*px,80+len*.25);ctx.lineTo(110,84);ctx.fill();
    if(broke&&len>0){ctx.fillStyle='#1d2826';ctx.fillRect(110+len*px-3,60,6,40)}
    // ruler
    ctx.fillStyle='#efdb72';ctx.fillRect(110,118,440,14);ctx.fillStyle='#1b1205';ctx.font='9px IBM Plex Mono';
    for(let mm=0;mm<=95;mm+=5){const x=110+mm*px;ctx.fillRect(x,118,1,mm%10?5:9);if(mm%10===0)ctx.fillText(mm,x+2,130)}
    ctx.fillStyle='#93a69e';ctx.font='10px IBM Plex Mono';ctx.fillText('mm',520,112);
  });
}

function renderLab(){
  const labC=S.contracts.filter(c=>['fieldDone','atLab','oven1','prep','oven2','measure','report'].includes(c.status));
  const atHQ=S.loc==='HQ',lm=labMult(),per=gear('crusher').per;
  const row=c=>{
    const prepMin=c.samples*per*lm;
    let act='',info='';
    const pct=c.status.startsWith('oven')?clamp((S.t-c.ovenStart)/(c.ovenEnd-c.ovenStart)*100,0,100):0;
    switch(c.status){
      case 'fieldDone':info='Samples are still in the ute. Drive back to HQ.';break;
      case 'atLab':info=`${c.samples} samples on the bench.`;act=`<button class="btn go" data-act="oven" data-arg="${c.id}" ${atHQ?'':'disabled'}>Load oven: initial dry (10 min)</button>`;break;
      case 'oven1':info=`Oven 1 at 105 °C. Done D${Math.floor(c.ovenEnd/1440)+1} ${clock(c.ovenEnd)} (${ovenLeft(c)} left).`;break;
      case 'prep':info=`Crush, sieve, plastic limit, liquid limit, linear shrinkage moulds. ${c.samples} samples × ${per} min${lm<1?` × crew ${lm.toFixed(2)}`:''} = <b>${dur(prepMin)}</b>.`;act=`<button class="btn go" data-act="prep" data-arg="${c.id}" ${atHQ?'':'disabled'}>Prep & test (${dur(prepMin)})</button>`;break;
      case 'oven2':info=`Oven 2: final dry weights. Done D${Math.floor(c.ovenEnd/1440)+1} ${clock(c.ovenEnd)} (${ovenLeft(c)} left).`;break;
      case 'measure':info='Dry LS bars and moisture tins are out of the oven.';act=`<button class="btn go" data-act="measure" data-arg="${c.id}" ${atHQ?'':'disabled'}>Measure & weigh (${dur(20*lm)})</button>`;break;
      case 'report':info='All results in. Time to write it up.';act=`<button class="btn go" data-act="report" data-arg="${c.id}" ${atHQ?'':'disabled'}>Write report</button>`;break;
    }
    return `<div class="card"><div class="labrow"><div><div class="eyebrow">#${c.id} · ${esc(c.town)} · due D${c.deadline}</div>
      <h3 style="font-size:17px">${ST[c.status][0]}</h3><p style="margin:4px 0" class="dim">${info}</p>
      ${c.status.startsWith('oven')?`<div class="timer"><i style="width:${pct}%"></i></div>`:''}</div><div class="row">${act}</div></div></div>`};
  const done=S.contracts.filter(c=>c.status==='done'||c.status==='failed').slice(-6).reverse();
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
   <div class="row" style="justify-content:space-between"><h2 style="font-size:26px;color:var(--book)">Moonah lab</h2>${atHQ?'<span class="chip c-ok">At HQ</span>':`<span class="chip c-bad">You’re in ${esc(S.loc)}. Lab work needs you at HQ.</span>`}</div>
   <div class="tip">Process: <b>oven 12 h</b> (initial dry) → <b>prep & testing ${per} min per sample</b> → <b>oven 12 h</b> (final dry weights) → measure → report. Ovens run while you do other jobs or sleep. Lab hours run to 22:00.</div>
   ${labC.length?labC.map(row).join(''):'<p class="dim">No samples in the lab. Go and dig some holes.</p>'}
   ${done.length?`<div class="card"><div class="eyebrow">Recent reports</div><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Site</th><th>Your class</th><th>Actual</th><th>Paid</th></tr></thead><tbody>${done.map(c=>`<tr><td>${c.id}</td><td>${esc(c.town)}</td><td class="num">${c.result?c.result.cls:'—'}</td><td class="num">${c.result?c.result.truth:'—'}</td><td class="num">${c.result?money(c.result.pay):'<span class="c-bad">lost</span>'}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  </div>`;
}
Object.assign(ACT,{
  oven(id){const c=C(id);if(c.status!=='atLab')return;if(!need(10,'lab','loading the oven'))return;spend(10);c.status='oven1';c.ovenStart=S.t;c.ovenEnd=S.t+720;say(`#${c.id}: samples in the oven at 105 °C. Back in 12 hours.`);render()},
  prep(id){const c=C(id);if(c.status!=='prep')return;const m=c.samples*gear('crusher').per*labMult();if(!need(m,'lab','prep & testing'))return;c.lab={layers:[],idx:0,min:m};labFlow(c)},
  measure(id){const c=C(id);if(c.status!=='measure')return;const m=20*labMult();if(!need(m,'lab','measuring'))return;c.meas=0;measureFlow(c)},
  report(id){const c=C(id);if(c.status!=='report')return;if(!need(90,'lab','writing the report (1.5 h)'))return;reportModal(c)},
});

function labLayers(c){return c.prof.layers.slice(0,c.logs.layers.length)}
function labFlow(c){
  const ls=labLayers(c),i=c.lab.layers.length;
  if(i>=ls.length){spend(c.lab.min);c.status='oven2';c.ovenStart=S.t;c.ovenEnd=S.t+720;
    say(`#${c.id}: prep & testing done (${dur(c.lab.min)}). Moisture tins and LS moulds into the oven for 12 hours.`);closeModal();return}
  const l=ls[i],tech=best('l');
  showModal(`<div class="sub">#${c.id} ${esc(c.town)} · layer ${i+1} of ${ls.length}</div><h2>Atterberg limits: ${esc(l.desc.split(':')[0])}</h2>
   <p>Crush and sieve to pass 425 µm, then the plastic limit thread and the liquid limit. A linear shrinkage mould gets filled from the LL paste.</p>
   <div><div class="eyebrow" style="margin-bottom:6px">Liquid limit method for this sample</div>
   <div class="choices" id="llm">${[['casa','Casagrande cup','AS 1289.3.1.1 · groove closes at 25 blows'],['cone','Cone penetrometer','AS 1289.3.9.1 · 20 mm penetration']].map(([k,t,d])=>`<button class="btn" data-m="${k}" aria-pressed="${llMethod()===k}"><b>${t}</b><br><span class="dim" style="font-size:12px">${d}</span></button>`).join('')}</div></div>
   <div class="row"><button class="btn go" id="lbMe">Do it myself</button>${tech&&tech.l>0?`<button class="btn" id="lbDel">Hand it to ${esc(tech.n)}</button>`:''}</div>`);
  sheet().querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.llMethod=b.dataset.m;sheet().querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#lbMe').onclick=()=>mgCrush(c,l,i,ls.length);
  if($('#lbDel'))$('#lbDel').onclick=()=>{const s=tech.l;const np=l.PL==null;
    c.lab.layers.push(np?{np:true}:{pl:r1(l.PL+gauss()*(2.2-.6*s)),ll:r1(l.LL+gauss()*(3-.8*s)),method:llMethod(),by:tech.n});
    toast(`${tech.n} runs the limits${np?'. Non-plastic.':' with the '+LLM[llMethod()]+'.'}`);labFlow(c)};
}
function mgCrush(c,l,i,n){
  if(S.gear.crusher){toast('The grinder whirrs. Sample passes 425 µm.');return mgPL(c,l,i,n)}
  let p=0;
  showModal(`<div class="sub">Sample prep · layer ${i+1}/${n}</div><h2>Mortar & pestle</h2>
   <div class="tip">Break up the oven-dried aggregates without crushing individual grains, then sieve through 425 µm. Only the fines go into the Atterberg tests.</div>
   <div class="timer" style="height:18px"><i id="cbar" style="width:0%"></i></div><div class="msg" id="cmsg">Clods the size of golf balls.</div>
   <div class="row"><button class="btn go" id="cG">GRIND</button><button class="btn" id="cS" disabled>Sieve → 425 µm</button></div>`);
  $('#cG').onclick=()=>{p=Math.min(100,p+rnd(7,13));$('#cbar').style.width=p+'%';$('#cmsg').textContent=p<40?'Clods breaking up…':p<80?'Getting there. Your wrist hurts.':'Fine powder. Good.';if(p>=80)$('#cS').disabled=false};
  $('#cS').onclick=()=>mgPL(c,l,i,n);
}
function mgPL(c,l,i,n){
  const NP=l.PL==null,PL=l.PL??0;
  let m=PL+rnd(2.5,5),d=12,strokes=0,crumb=false,crumbD=0,intactWarn=false,acc=0,lastY=null,dir=0,lastT=0,res=null,cracks=0;
  showModal(`<div class="sub">AS 1289.3.2.1 · layer ${i+1}/${n}</div><h2>Plastic limit: roll the thread</h2>
   <div class="tip">Roll the soil on the glass plate with your palm (drag up and down across the thread, or use the button) at an even pressure. The <b>plastic limit</b> is the moisture content at which the thread <b>crumbles at 3 mm</b> diameter. Still intact at 3 mm? It’s too wet: re-form it into a ball and roll again (handling dries it). Crumbles fatter than 3 mm? Too dry: add a drop of water.</div>
   <canvas id="plcv" style="touch-action:none;cursor:grab"></canvas>
   <div class="msg" id="plmsg">Drag up and down over the thread to roll it.</div>
   <div class="row"><button class="btn" id="plR">Roll ↕</button><button class="btn" id="plF">Re-form into a ball</button><button class="btn" id="plW">Add a drop of water</button>
   <button class="btn go" id="plB">Crumbled at 3 mm: into the tin</button><button class="btn" id="plN">Won’t form a thread: record non-plastic</button></div>`,()=>stopLoop());
  const cv=$('#plcv'),ctx=setupCanvas(cv,560,220),msg=$('#plmsg');
  const roll=()=>{if(crumb)return;strokes++;
    if(NP){crumb=true;crumbD=d;msg.className='msg bad';msg.textContent='It falls apart into crumbs. You can’t form a thread at all.';return}
    d=Math.max(2.4,d-.45*rnd(.85,1.15));m-=.06;

const LLM={casa:'Casagrande cup',cone:'cone penetrometer'};

   <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px"><canvas id="cacv"></canvas><canvas id="cach"></canvas></div>

   <div class="tip">The paste was trowelled into a 125 mm mould, air dried, then oven dried. Close the vernier caliper jaw onto the end of the dry bar. <b>LS = (1 − L<sub>dry</sub> / 125) × 100</b>. If it cracked, fit the pieces together; if it curled, measure along the centre line.</div>
   <canvas id="lscv"></canvas>
   <input type="range" id="lsr" min="90" max="125" step="0.1" value="${read.toFixed(1)}" aria-label="Caliper jaw position">
   <div class="row"><button class="btn sm" id="lm">−0.1</button><button class="btn sm" id="lp">+0.1</button><span class="mono" id="lsv"></span><button class="btn go" id="lsOk">Record length</button></div>`,()=>stopLoop());

  loop(()=>{ctx.fillStyle='#1d2826';ctx.fillRect(0,0,560,200);
    const k=3.6,x0=60,y=60;
    ctx.fillStyle='#6f7a77';ctx.fillRect(x0-4,y-8,L0*k+8,36);ctx.fillStyle='#4c5553';ctx.fillRect(x0,y-4,L0*k,28);

    // caliper
    ctx.fillStyle='#cfd8d3';ctx.fillRect(x0-14,y-30,10,70);const jx=x0+read*k;ctx.fillRect(jx,y-30,10,70);ctx.fillRect(x0-14,y-34,L0*k+40,6);
    ctx.fillStyle='#93a69e';ctx.font='10px IBM Plex Mono';for(let mm=0;mm<=125;mm+=5){ctx.fillRect(x0+mm*k,y+36,1,mm%10?4:8);if(mm%25===0)ctx.fillText(mm,x0+mm*k-6,y+56)}
    // zoom
    const zx=360,zy=125,zw=180,zh=64,zk=40;ctx.save();ctx.beginPath();ctx.rect(zx,zy,zw,zh);ctx.clip();ctx.fillStyle='#0b1211';ctx.fillRect(zx,zy,zw,zh);

    ctx.fillStyle='#cfd8d3';ctx.fillRect(zx+zw/2+(read-ctr)*zk,zy,12,zh);ctx.restore();ctx.strokeStyle='#efdb72';ctx.strokeRect(zx,zy,zw,zh);
    ctx.fillStyle='#efdb72';ctx.fillText('×10 loupe on the jaw',zx,zy-4);
  });
}
function tinQuiz(c){
  const i=c.lab.layers.findIndex(x=>!x.np&&x.pl!=null);
  const fin=()=>{spend(20*labMult());c.status='report';say(`#${c.id}: all results in. Ready to write the report.`);closeModal()};
  if(i<0)return fin();
  const pl=c.lab.layers[i].pl,tin=r1(rnd(15,22)*100)/100,dry=rnd(4,7),wat=dry*pl/100;
  const m1=tin.toFixed(2),m2=(tin+dry+wat).toFixed(2),m3=(tin+dry).toFixed(2);
  const truth=(m2-m3)/(m3-m1)*100;
  showModal(`<div class="sub">AS 1289.2.1.1 · moisture content</div><h2>Weigh the PL tin</h2>
   <div class="tip">Moisture content <b>w = (m<sub>wet</sub> − m<sub>dry</sub>) / (m<sub>dry</sub> − m<sub>tin</sub>) × 100</b>. Water mass divided by <i>dry soil</i> mass, not wet mass. That’s the classic grad mistake.</div>
   <table class="tbl" style="max-width:420px"><tr><td>Tin T${rint(10,99)} mass</td><td class="num">${m1} g</td></tr><tr><td>Tin + wet crumbs</td><td class="num">${m2} g</td></tr><tr><td>Tin + dry crumbs (after 12 h at 105 °C)</td><td class="num">${m3} g</td></tr></table>
   <label class="row">Plastic limit for layer ${i+1} = <input type="number" id="tq" step="0.1" style="width:90px"> %</label>
   <div class="row"><button class="btn go" id="tqOk">Check</button><button class="btn" id="tqS">Let the spreadsheet do it</button></div><div class="msg" id="tqm"></div>`);
  $('#tqOk').onclick=()=>{const v=+$('#tq').value;if(Math.abs(v-truth)<=.3){S.rep=clamp(S.rep+1,0,100);toast(`Correct: ${truth.toFixed(1)}%. +1 rep. You can do maths in a lab coat.`);fin()}
    else{$('#tqm').className='msg bad';$('#tqm').textContent=`Not quite. (${m2} − ${m3}) / (${m3} − ${m1}) × 100 = ${truth.toFixed(1)}%`;$('#tqOk').textContent='Continue';$('#tqOk').onclick=fin}};
  $('#tqS').onclick=fin;
}

/* ---------- Report ---------- */
function uscsFrom(ll,pi,np,tex,org){
  if(org)return['OH/Pt'];
  if(np)return['SP','SM'];
  const a=.73*(ll-20),c=pi>=a&&pi>=4?'C':'M',h=ll>=50?'H':'L';
  const fine=c+h;
  if(SANDY.includes(tex))return['SC','SM',fine];
  return[fine];
}
function ysCalc(layers,rock){
  const lim=Math.min(HS,rock??HS);let ys=0;const rows=[];
  layers.forEach(L=>{const top=L.top,bot=Math.min(L.bot,lim);if(bot<=top)return;const h=(bot-top)*1000,zm=(top+bot)/2,du=1.2*(1-zm/HS),iss=L.sandy?0:L.LS*.3,y=iss*du*h/100;ys+=y;rows.push({top,bot,iss,du,h,y})});
  return{ys,rows,lim};
}
function classFromYs(ys,allSandy){return allSandy&&ys<=20?'A':ys<=20?'S':ys<=40?'M':ys<=60?'H1':ys<=75?'H2':'E'}
function truthClass(c){
  if(c.prof.flagP)return{cls:'P',ys:null,why:{landslip:'mapped landslide hazard on Tertiary clays',fill:'uncontrolled fill deeper than 0.4 m',soft:'soft and organic soils'}[c.prof.flagP]};
  const ls=c.prof.layers.map(l=>({...l,sandy:SANDY.includes(l.tex)}));
  const r=ysCalc(ls,c.prof.rock);return{cls:classFromYs(r.ys,ls.every(l=>l.sandy)),ys:r.ys};
}
